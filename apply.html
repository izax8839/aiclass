<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강 신청 &amp; 1:1 무료 상담 접수 | AI Nexus Academy</title>
  <meta name="description" content="AI Nexus Academy 수강 신청 및 커리어 진단 무료 상담 접수 센터">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#EEF2FF', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#0B0F19] text-gray-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col justify-between">

  <!-- ==================== HEADER ==================== -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-40 glass-nav transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-black tracking-tight text-white group-hover:text-indigo-300 transition">AI NEXUS</span>
          <span class="text-[10px] tracking-widest text-indigo-400 font-semibold uppercase -mt-1">Application Center</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
        <a href="index.html" class="hover:text-white transition">홈으로</a>
        <a href="courses.html" class="hover:text-white transition">전체 과정</a>
        <a href="index.html#faq" class="hover:text-white transition">FAQ</a>
      </nav>

      <div class="flex items-center space-x-4">
        <a href="tel:02-555-8900" class="text-xs sm:text-sm text-gray-400 hover:text-white flex items-center space-x-1">
          <i data-lucide="phone" class="w-4 h-4 text-indigo-400"></i>
          <span>02-555-8900</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ==================== FORM SECTION ==================== -->
  <main class="pt-32 pb-24 relative overflow-hidden bg-gradient-glow flex-grow flex items-center">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full relative z-10">
      
      <div class="glass-card rounded-3xl p-8 sm:p-12 border border-indigo-500/30 shadow-2xl">
        
        <div class="text-center max-w-xl mx-auto mb-10">
          <span class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
            2025/2026 수강 신청 &amp; 무료 상담
          </span>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-white mt-4 tracking-tight">
            당신의 AI 여정을 시작하세요
          </h1>
          <p class="text-xs sm:text-sm text-gray-300 mt-2">
            접수해 주시면 전담 매니저가 2시간 이내에 전화를 드려 상세 커리큘럼 및 할인 혜택을 안내해 드립니다.
          </p>
        </div>

        <form data-ajax-form class="space-y-6">
          
          <!-- Course Selection -->
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-2">희망 수강 과정 선택 *</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <label class="cursor-pointer border border-gray-700/80 rounded-xl p-4 flex items-start space-x-3 hover:border-indigo-500 transition bg-gray-900/40">
                <input type="radio" name="course_choice" value="generative-ai" checked class="mt-1 text-indigo-600 focus:ring-indigo-500">
                <div>
                  <span class="text-sm font-bold text-white block">생성형 AI &amp; 프롬프트 마스터</span>
                  <span class="text-xs text-indigo-400 block mt-0.5">4주 완성 | 입문 | 320,000원</span>
                </div>
              </label>

              <label class="cursor-pointer border border-gray-700/80 rounded-xl p-4 flex items-start space-x-3 hover:border-purple-500 transition bg-gray-900/40">
                <input type="radio" name="course_choice" value="business-automation" class="mt-1 text-purple-600 focus:ring-purple-500">
                <div>
                  <span class="text-sm font-bold text-white block">업무 자동화 &amp; 노코드 실전</span>
                  <span class="text-xs text-purple-400 block mt-0.5">6주 완성 | 초중급 | 480,000원</span>
                </div>
              </label>

              <label class="cursor-pointer border border-gray-700/80 rounded-xl p-4 flex items-start space-x-3 hover:border-blue-500 transition bg-gray-900/40">
                <input type="radio" name="course_choice" value="deep-learning" class="mt-1 text-blue-600 focus:ring-blue-500">
                <div>
                  <span class="text-sm font-bold text-white block">딥러닝/머신러닝 코어 부트캠프</span>
                  <span class="text-xs text-blue-400 block mt-0.5">8주 집중 | 중급 | 890,000원</span>
                </div>
              </label>

              <label class="cursor-pointer border border-gray-700/80 rounded-xl p-4 flex items-start space-x-3 hover:border-pink-500 transition bg-gray-900/40">
                <input type="radio" name="course_choice" value="llm-agent" class="mt-1 text-pink-600 focus:ring-pink-500">
                <div>
                  <span class="text-sm font-bold text-white block">LLM 서비스 개발 &amp; RAG 에이전트</span>
                  <span class="text-xs text-pink-400 block mt-0.5">8주 실전 | 고급 | 1,150,000원</span>
                </div>
              </label>
            </div>
          </div>

          <!-- User Details -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5">신청자 성함 *</label>
              <input type="text" name="name" required placeholder="홍길동" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5">연락처 *</label>
              <input type="tel" name="phone" required placeholder="010-1234-5678" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5">이메일 *</label>
              <input type="email" name="email" required placeholder="example@email.com" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5">현재 직무 및 소속</label>
              <input type="text" name="job" placeholder="예: 스타트업 마케터 / 대학생" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">선호 상담 시간대</label>
            <select name="contact_time" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition">
              <option value="anytime">언제든 연락 가능</option>
              <option value="morning">오전 (10:00 ~ 12:00)</option>
              <option value="afternoon">오후 (13:00 ~ 17:00)</option>
              <option value="evening">저녁 (18:00 ~ 20:00)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">궁금한 점이나 현재 고민</label>
            <textarea name="message" rows="3" placeholder="어떤 점이 궁금하신가요? 내 수준에 맞을지, 환불 규정이나 커리큘럼 문의 등 무엇이든 적어주세요." class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-indigo-500 focus:outline-none transition resize-none"></textarea>
          </div>

          <div class="pt-2">
            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-base shadow-xl shadow-indigo-600/30 transition transform hover:-translate-y-0.5">
              수강 신청 및 무료 상담 접수하기
            </button>
          </div>

          <p class="text-[11px] text-gray-400 text-center">
            수강 확정 전까지 결제는 진행되지 않으며 언제든 취소 가능합니다.
          </p>
        </form>

      </div>

    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="bg-[#080B12] border-t border-gray-800/80 py-8 text-gray-400 text-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex flex-col sm:flex-row items-center justify-between">
      <p>© 2026 AI Nexus Academy. All rights reserved.</p>
      <div class="mt-2 sm:mt-0 space-x-4">
        <a href="index.html" class="hover:text-white">메인 홈</a>
        <a href="courses.html" class="hover:text-white">전체 과정</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
