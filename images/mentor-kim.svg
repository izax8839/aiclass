<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="skinGradKim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5"/>
      <stop offset="100%" stop-color="#F5B990"/>
    </linearGradient>
    <linearGradient id="hairGradKim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="clothGradKim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGradKim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowKim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with abstract grid & glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradKim)"/>
  
  <!-- Abstract cyber grid lines -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.25"/>
  <path d="M 60 200 H 340 M 200 60 V 340" stroke="#a5b4fc" stroke-width="0.8" stroke-dasharray="6 6" opacity="0.2"/>

  <!-- Body / Hoodie / Jacket (Modern Tech Producer) -->
  <path d="M 100 370 C 100 300, 130 270, 200 270 C 270 270, 300 300, 300 370 Z" fill="url(#clothGradKim)"/>
  <!-- Jacket inner shirt & zipper accent -->
  <path d="M 175 270 L 200 340 L 225 270 Z" fill="#090d16"/>
  <line x1="200" y1="270" x2="200" y2="370" stroke="url(#accentGradKim)" stroke-width="3" filter="url(#glowKim)"/>

  <!-- Neck -->
  <rect x="180" y="215" width="40" height="60" rx="8" fill="#F5B990"/>
  <!-- Neck shadow -->
  <path d="M 180 235 C 190 250, 210 250, 220 235 Z" fill="#E6A177" opacity="0.6"/>

  <!-- Head (Asian male jawline - clean & masculine) -->
  <path d="M 145 150 C 145 100, 255 100, 255 150 C 255 195, 235 240, 200 240 C 165 240, 145 195, 145 150 Z" fill="url(#skinGradKim)"/>

  <!-- Ears -->
  <ellipse cx="143" cy="158" rx="8" ry="15" fill="#F5B990"/>
  <ellipse cx="257" cy="158" rx="8" ry="15" fill="#F5B990"/>

  <!-- Stylish Minimal Eyes & Eyebrows (Asian feature - sharp, intelligent) -->
  <path d="M 162 138 C 170 135, 180 137, 186 140" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 214 140 C 220 137, 230 135, 238 138" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <path d="M 165 154 C 172 151, 180 152, 185 156" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="175" cy="155" r="2.5" fill="#18181b"/>
  
  <path d="M 215 156 C 220 152, 228 151, 235 154" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="225" cy="155" r="2.5" fill="#18181b"/>

  <!-- Nose & Mouth (Minimal abstract style) -->
  <path d="M 200 156 L 198 175 L 204 175" stroke="#E6A177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 188 198 C 195 202, 205 202, 212 198" stroke="#D98A68" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Hair (Modern Korean Dandy Cut / Textured Side Part) -->
  <path d="M 140 145 C 135 110, 150 75, 200 75 C 250 75, 265 105, 260 145 C 255 125, 245 105, 225 100 C 200 95, 175 110, 160 115 C 148 120, 142 135, 140 145 Z" fill="url(#hairGradKim)"/>
  <!-- Hair highlights (abstract indigo sheen) -->
  <path d="M 165 92 C 185 85, 215 85, 240 98" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Tech Producer Accents: Modern Floating Cyber Tag / Sound Wave -->
  <g transform="translate(45, 55)">
    <rect width="64" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <text x="32" y="16" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROD</text>
  </g>

  <!-- Glowing Soundwave Accent -->
  <g transform="translate(300, 60)" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="14" x2="0" y2="22"/>
    <line x1="6" y1="8" x2="6" y2="28"/>
    <line x1="12" y1="2" x2="12" y2="34"/>
    <line x1="18" y1="10" x2="18" y2="26"/>
    <line x1="24" y1="14" x2="24" y2="22"/>
  </g>
</svg>
