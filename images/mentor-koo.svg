<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="skinGradKoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1CA"/>
      <stop offset="100%" stop-color="#F6C4A2"/>
    </linearGradient>
    <linearGradient id="hairGradKoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clothGradKoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="accentGradKoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glowKoo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with abstract grid & glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradKoo)"/>
  
  <!-- Abstract cyber grid & neural connections -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.25"/>
  <path d="M 60 200 H 340 M 200 60 V 340" stroke="#bae6fd" stroke-width="0.8" stroke-dasharray="6 6" opacity="0.2"/>

  <!-- Body / Minimal Tech Knit & Coat -->
  <path d="M 100 370 C 100 300, 130 270, 200 270 C 270 270, 300 300, 300 370 Z" fill="url(#clothGradKoo)"/>
  <path d="M 170 270 L 200 335 L 230 270 Z" fill="#070d18"/>
  <path d="M 170 270 L 200 335 L 230 270" stroke="url(#accentGradKoo)" stroke-width="2.5" fill="none" filter="url(#glowKoo)"/>

  <!-- Neck -->
  <rect x="182" y="215" width="36" height="60" rx="6" fill="#F6C4A2"/>
  <!-- Neck shadow -->
  <path d="M 182 235 C 190 250, 210 250, 218 235 Z" fill="#E2A680" opacity="0.6"/>

  <!-- Head (Asian male jawline - clean, intellectual) -->
  <path d="M 148 150 C 148 100, 252 100, 252 150 C 252 195, 232 238, 200 238 C 168 238, 148 195, 148 150 Z" fill="url(#skinGradKoo)"/>

  <!-- Ears -->
  <ellipse cx="145" cy="160" rx="7" ry="14" fill="#F6C4A2"/>
  <ellipse cx="255" cy="160" rx="7" ry="14" fill="#F6C4A2"/>

  <!-- Hair (Clean, neat Asian male parted short crop) -->
  <path d="M 144 145 C 138 110, 150 72, 200 72 C 248 72, 262 105, 256 145 C 250 120, 240 102, 222 96 C 195 88, 170 105, 154 112 C 146 118, 144 135, 144 145 Z" fill="url(#hairGradKoo)"/>
  <!-- Hair sheen -->
  <path d="M 168 88 C 188 80, 220 82, 242 94" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Eyebrows (Neat & focused) -->
  <path d="M 164 136 C 172 133, 182 134, 188 137" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M 212 137 C 218 134, 228 133, 236 136" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Modern Tech Glasses (Intellectual Asian Researcher - Thin geometric frame with cyan accent) -->
  <rect x="160" y="142" width="30" height="22" rx="5" fill="#0f172a" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2.2" filter="url(#glowKoo)"/>
  <rect x="210" y="142" width="30" height="22" rx="5" fill="#0f172a" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2.2" filter="url(#glowKoo)"/>
  <!-- Bridge -->
  <path d="M 190 152 C 195 149, 205 149, 210 152" stroke="#38bdf8" stroke-width="2.2" fill="none"/>

  <!-- Eyes behind glasses -->
  <circle cx="175" cy="153" r="2.8" fill="#0f172a"/>
  <circle cx="176" cy="152" r="1" fill="#ffffff"/>
  <circle cx="225" cy="153" r="2.8" fill="#0f172a"/>
  <circle cx="226" cy="152" r="1" fill="#ffffff"/>

  <!-- Nose & Mouth -->
  <path d="M 200 158 L 198 176 L 203 176" stroke="#E2A680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 188 198 C 196 202, 204 202, 212 198" stroke="#D18960" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Deep Learning Badge / Neural Matrix Accent -->
  <g transform="translate(45, 55)">
    <rect width="64" height="24" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="32" y="16" fill="#bae6fd" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CORE</text>
  </g>

  <!-- Neural Net Symbol -->
  <g transform="translate(300, 58)" opacity="0.85">
    <circle cx="6" cy="8" r="3.5" fill="#38bdf8"/>
    <circle cx="6" cy="24" r="3.5" fill="#38bdf8"/>
    <circle cx="24" cy="16" r="3.5" fill="#2dd4bf"/>
    <line x1="6" y1="8" x2="24" y2="16" stroke="#7dd3fc" stroke-width="1.2"/>
    <line x1="6" y1="24" x2="24" y2="16" stroke="#7dd3fc" stroke-width="1.2"/>
  </g>
</svg>
